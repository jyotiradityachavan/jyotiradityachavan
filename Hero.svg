<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1E90FF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>
  
  <!-- Grid -->
  <g opacity="0.12" stroke="#444" stroke-width="0.5">
    <path d="M0 80 L800 80 M0 160 L800 160 M0 240 L800 240 M0 320 L800 320"/>
    <path d="M160 0 L160 400 M320 0 L320 400 M480 0 L480 400 M640 0 L640 400"/>
  </g>

  <!-- Moving Hexagons -->
  <g transform="translate(530,195)">
    <circle cx="0" cy="0" r="165" fill="url(#mainGradient)" opacity="0.07"/>
    
    <!-- Large Hexagon -->
    <path d="M-165,0 L-82.5,-143 L82.5,-143 L165,0 L82.5,143 L-82.5,143 Z" 
          fill="none" stroke="#00BFFF" stroke-width="1.8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="38s" repeatCount="indefinite"/>
    </path>
    
    <!-- Medium Hexagon -->
    <path d="M-115,0 L-57.5,-99.5 L57.5,-99.5 L115,0 L57.5,99.5 L-57.5,99.5 Z" 
          fill="none" stroke="#1E90FF" stroke-width="2.2" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="26s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main Content -->
  <g transform="translate(45,120)">
    <text x="0" y="0" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#ffffff">
      Jyotiraditya Chavan
    </text>
    <text x="0" y="38" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="600" fill="#00BFFF">
      Aspiring Machine Learning Engineer
    </text>
    
    <!-- Skills with Icons (Only from your resume) -->
    <text x="0" y="68" font-family="system-ui,-apple-system,sans-serif" font-size="14.5" fill="#aaaaaa">
      🤖 Multimodal AI • 👁️ Computer Vision • 📄 OCR (Qwen-VL)
    </text>
    <text x="0" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="14.5" fill="#aaaaaa">
      📊 Time-Series Analysis • 🔄 Transformer Models • 🧠 CNN
    </text>
    <text x="0" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="14.5" fill="#aaaaaa">
      🛠️ Hugging Face • 📈 Data Analytics •
    </text>
  </g>

  <!-- Bottom Tagline -->
  <text x="400" y="355" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="500" fill="#888888" text-anchor="middle">
    Building Intelligent Systems with AI &amp; Data
  </text>
</svg>
